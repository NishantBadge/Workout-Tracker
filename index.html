<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --border:#E2E6EB;
    --text:#1F2933; --muted:#6B7785; --muted-2:#9AA5B1;
    --primary:#2E5A88; --primary-dark:#1F3F60; --primary-tint:#EAF1F8;
    --success:#2F7A52; --success-tint:#E9F5EE;
    --danger:#B3423B; --danger-tint:#FBECEA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding-bottom:60px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:660px; margin:0 auto; padding:0 20px;}

  header{padding:32px 20px 18px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--primary); margin-bottom:8px; font-weight:600;}
  h1{font-weight:700; font-size:26px; color:var(--text);}
  .status{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .status .dot{width:7px; height:7px; border-radius:50%; background:var(--muted-2); display:inline-block;}
  .status.ok .dot{background:var(--success);}
  .status.bad .dot{background:var(--danger);}
  .status.ok{color:var(--success);}
  .status.bad{color:var(--danger);}

  main{padding-top:6px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:16px; box-shadow:0 1px 2px rgba(16,24,32,0.04);}
  .card h2{font-weight:600; font-size:14px; color:var(--text); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;}
  .card h2 .sub{font-weight:500; font-size:11.5px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; text-transform:none;}

  /* TABS (shared by page tabs) */
  .tabs{display:flex; gap:6px; margin-bottom:16px; background:var(--bg); padding:4px; border-radius:9px; border:1px solid var(--border);}
  .page-tabs{margin-bottom:20px;}
  .tab-btn{
    flex:1; padding:10px 10px; border:none; background:transparent; color:var(--muted);
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; border-radius:6px; cursor:pointer;
  }
  .tab-btn.active{background:var(--card); color:var(--primary); box-shadow:0 1px 2px rgba(16,24,32,0.08);}

  /* FORM ELEMENTS */
  label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input, select{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14.5px; font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{outline:none; border-color:var(--primary); background:var(--card);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* STOPWATCH */
  .stopwatch{text-align:center; padding:6px 0 4px;}
  .clock{font-family:'JetBrains Mono',monospace; font-size:44px; font-weight:700; letter-spacing:.02em; color:var(--text);}
  .clock.running{color:var(--success);}
  .sw-buttons{display:flex; gap:8px; justify-content:center; margin-top:14px;}
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    border:1px solid var(--border); background:var(--card); color:var(--text);
    padding:9px 16px; border-radius:8px; cursor:pointer;
  }
  button.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  button.primary:hover:not(:disabled){background:var(--primary-dark);}
  button.stop{background:var(--danger); color:#fff; border-color:var(--danger);}
  button:disabled{opacity:.4; cursor:not-allowed;}

  /* SETS BUILDER */
  .set-row{display:grid; grid-template-columns:36px 1fr 1fr 32px; gap:8px; align-items:center; margin-top:10px;}
  .set-row .set-num{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--primary);
    background:var(--primary-tint); border-radius:6px; height:38px; display:flex; align-items:center; justify-content:center;
  }
  .set-row input{padding:8px 10px; font-size:14px;}
  .set-remove{
    background:none; border:none; color:var(--muted-2); font-size:16px; cursor:pointer; padding:0;
    width:32px; height:38px; display:flex; align-items:center; justify-content:center;
  }
  .set-remove:hover{color:var(--danger);}
  .add-set-btn{width:100%; margin-top:12px; border-style:dashed; color:var(--primary); background:var(--primary-tint); border-color:var(--primary);}
  .submit-btn{width:100%; margin-top:18px; padding:13px; font-size:14.5px;}

  /* TABLES */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--muted-2); padding:6px 6px; border-bottom:1px solid var(--border);}
  td{padding:8px 6px; border-bottom:1px solid var(--bg); text-transform:capitalize;}
  td.dur{font-family:'JetBrains Mono',monospace; color:var(--primary); white-space:nowrap;}
  .empty{color:var(--muted-2); font-size:13px; padding:14px 0; text-align:center;}
  .refresh{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); background:none; border:none; padding:0; text-decoration:underline; cursor:pointer; font-weight:500;}

  /* ANALYSIS */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat-box{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 10px; text-align:center;}
  .stat-label{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--muted-2); margin-bottom:6px;}
  .stat-value{font-weight:700; font-size:18px; color:var(--text);}
  .stat-value.up{color:var(--success);}
  .stat-value.down{color:var(--danger);}
  .stat-sub{font-size:11px; color:var(--muted-2); margin-top:4px;}
  canvas{max-width:100%;}
  @media (max-width:520px){ .stat-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="wrap">
  <div class="eyebrow">Personal Training Log</div>
  <h1>Workout Tracker</h1>
  <div id="connStatus" class="status"><span class="dot"></span><span>Checking connection…</span></div>
</header>

<main class="wrap">

  <div class="tabs page-tabs">
    <button class="tab-btn active" id="pageTabLog">Log Workout</button>
    <button class="tab-btn" id="pageTabAnalysis">Analysis</button>
  </div>

  <!-- ============ LOG WORKOUT PAGE ============ -->
  <div id="logPage">

    <div class="card">
      <h2>Exercise</h2>
      <label for="logBodyPart">Body Part</label>
      <select id="logBodyPart">
        <option value="">Select a body part…</option>
      </select>

      <label for="exerciseInput">Exercise Name</label>
      <input id="exerciseInput" type="text" placeholder="e.g. Barbell Bench Press">
    </div>

    <div class="card">
      <h2>Session Timer</h2>
      <div class="stopwatch">
        <div id="clock" class="clock">00:00</div>
        <div class="sw-buttons">
          <button id="startBtn" class="primary">Start</button>
          <button id="stopBtn" class="stop" disabled>Stop</button>
          <button id="resetBtn" disabled>Reset</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Sets<span class="sub" id="setCount">1 set</span></h2>
      <div id="setsContainer"></div>
      <button class="add-set-btn" id="addSetBtn">+ Add Set</button>

      <label for="notes" style="margin-top:16px;">Notes (optional)</label>
      <input id="notes" type="text" placeholder="e.g. felt strong, last set to failure">

      <button id="logBtn" class="primary submit-btn">Submit Exercise</button>
      <div id="logStatus" class="status" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Today's Log <button class="refresh" id="refreshBtn">refresh</button></h2>
      <div id="logTableWrap"><div class="empty">Loading…</div></div>
    </div>

  </div>

  <!-- ============ ANALYSIS PAGE ============ -->
  <div id="analysisPage" style="display:none;">

    <div class="card">
      <h2>Filters</h2>
      <div class="field-row">
        <div>
          <label for="analysisBodyPart">Body Part</label>
          <select id="analysisBodyPart"><option value="">All Body Parts</option></select>
        </div>
        <div>
          <label for="analysisExercise">Exercise</label>
          <select id="analysisExercise"><option value="">All Exercises</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>This Week vs Last Week</h2>
      <div id="weekCompare"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
      <h2>Progression</h2>
      <canvas id="progressChart" height="220"></canvas>
    </div>

    <div class="card">
      <h2>Session History</h2>
      <div id="historyTableWrap"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
      <h2>Weekly Pattern</h2>
      <div id="weeklyPatternWrap"><div class="empty">Loading…</div></div>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
  // ====== CONFIG ======
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlXrrh7EO9y_A-5zElVdCBz2CDtEhXE4BKaWCcJiErKx9ZUMUzLi2bHLu57LUhLPpwCg/exec";
  // =====================

  const BODY_PARTS = ['Chest','Back','Shoulders','Upper Arms','Lower Arms','Upper Legs','Lower Legs','Waist','Cardio','Neck','Full Body'];
  const logBodyPart = document.getElementById('logBodyPart');
  BODY_PARTS.forEach(bp => {
    const opt = document.createElement('option');
    opt.value = bp; opt.textContent = bp;
    logBodyPart.appendChild(opt);
  });

  // ---- Page tabs ----
  const pageTabLog = document.getElementById('pageTabLog');
  const pageTabAnalysis = document.getElementById('pageTabAnalysis');
  const logPage = document.getElementById('logPage');
  const analysisPage = document.getElementById('analysisPage');
  function switchPage(p){
    if (p === 'log') {
      pageTabLog.classList.add('active'); pageTabAnalysis.classList.remove('active');
      logPage.style.display = ''; analysisPage.style.display = 'none';
    } else {
      pageTabAnalysis.classList.add('active'); pageTabLog.classList.remove('active');
      analysisPage.style.display = ''; logPage.style.display = 'none';
      loadAnalysis();
    }
  }
  pageTabLog.addEventListener('click', () => switchPage('log'));
  pageTabAnalysis.addEventListener('click', () => switchPage('analysis'));

  function getSelectedExerciseName(){ return document.getElementById('exerciseInput').value.trim(); }
  function getSelectedBodyPart(){ return logBodyPart.value; }

  // ---- Stopwatch ----
  let timerInterval = null, elapsedSeconds = 0, running = false;
  const clockEl = document.getElementById('clock');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');

  function formatTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = (sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }
  function tick(){ elapsedSeconds++; clockEl.textContent = formatTime(elapsedSeconds); }

  startBtn.addEventListener('click', () => {
    if (running) return;
    running = true; clockEl.classList.add('running');
    timerInterval = setInterval(tick, 1000);
    startBtn.disabled = true; stopBtn.disabled = false; resetBtn.disabled = true;
  });
  stopBtn.addEventListener('click', () => {
    running = false; clockEl.classList.remove('running');
    clearInterval(timerInterval);
    startBtn.disabled = false; stopBtn.disabled = true; resetBtn.disabled = false;
  });
  resetBtn.addEventListener('click', () => {
    elapsedSeconds = 0; clockEl.textContent = '00:00'; resetBtn.disabled = true;
  });

  // ---- Sets builder ----
  const setsContainer = document.getElementById('setsContainer');
  const setCountLabel = document.getElementById('setCount');

  function renumberSets(){
    [...setsContainer.querySelectorAll('.set-row')].forEach((row, i) => {
      row.querySelector('.set-num').textContent = `#${i+1}`;
    });
    const n = setsContainer.querySelectorAll('.set-row').length;
    setCountLabel.textContent = `${n} set${n>1?'s':''}`;
  }
  function addSetRow(){
    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `
      <div class="set-num">#${setsContainer.children.length+1}</div>
      <input type="number" min="0" placeholder="Reps" class="reps-input">
      <input type="number" min="0" step="0.5" placeholder="Weight (kg)" class="weight-input">
      <button type="button" class="set-remove" title="Remove set">✕</button>
    `;
    row.querySelector('.set-remove').addEventListener('click', () => {
      if (setsContainer.querySelectorAll('.set-row').length <= 1) return;
      row.remove(); renumberSets();
    });
    setsContainer.appendChild(row);
    renumberSets();
  }
  addSetRow();
  document.getElementById('addSetBtn').addEventListener('click', addSetRow);
  function resetSets(){ setsContainer.innerHTML = ''; addSetRow(); }

  // ---- Submit ----
  function todayStr(){ return new Date().toISOString().split('T')[0]; }
  function dayName(){ return new Date().toLocaleDateString('en-US', { weekday: 'long' }); }

  document.getElementById('logBtn').addEventListener('click', async () => {
    const exercise = getSelectedExerciseName();
    const bodyPart = getSelectedBodyPart();
    const notes = document.getElementById('notes').value.trim();
    const logStatus = document.getElementById('logStatus');

    if (!exercise) {
      logStatus.textContent = 'Type an exercise name first.';
      logStatus.className = 'status bad';
      return;
    }
    if (WEB_APP_URL.includes('PASTE_YOUR')) {
      logStatus.textContent = 'Web App URL not configured yet — see setup steps.';
      logStatus.className = 'status bad';
      return;
    }

    const setRows = [...setsContainer.querySelectorAll('.set-row')];
    logStatus.textContent = 'Saving…';
    logStatus.className = 'status';

    try {
      for (let i = 0; i < setRows.length; i++) {
        const reps = setRows[i].querySelector('.reps-input').value;
        const weight = setRows[i].querySelector('.weight-input').value;
        const payload = {
          date: todayStr(), day: dayName(),
          exercise, bodyPart,
          setNumber: i + 1, reps, weight,
          duration: elapsedSeconds, notes
        };
        await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      }
      logStatus.textContent = `Logged ✓ ${exercise} — ${setRows.length} set(s), ${elapsedSeconds}s`;
      logStatus.className = 'status ok';

      document.getElementById('exerciseInput').value = '';
      logBodyPart.value = '';
      document.getElementById('notes').value = '';
      resetSets();
      elapsedSeconds = 0; clockEl.textContent = '00:00'; resetBtn.disabled = true;

      loadTodayLog();
    } catch (err) {
      logStatus.textContent = 'Save failed — check the Web App URL / deployment.';
      logStatus.className = 'status bad';
    }
  });

  // ---- Today's log ----
  async function loadTodayLog(){
    const wrap = document.getElementById('logTableWrap');
    if (WEB_APP_URL.includes('PASTE_YOUR')) {
      wrap.innerHTML = '<div class="empty">Connect your Web App URL to see today\'s log.</div>';
      return;
    }
    try {
      const res = await fetch(`${WEB_APP_URL}?date=${todayStr()}`);
      const data = await res.json();
      if (!data.length) {
        wrap.innerHTML = '<div class="empty">No sets logged yet today.</div>';
        return;
      }
      let html = '<table><tr><th>Exercise</th><th>Set</th><th>Reps</th><th>Wt</th><th>Time</th></tr>';
      data.forEach(r => {
        html += `<tr><td>${r.Exercise||''}</td><td>${r.SetNumber||''}</td><td>${r.Reps||''}</td><td>${r.Weight||''}</td><td class="dur">${r.Duration||0}s</td></tr>`;
      });
      html += '</table>';
      wrap.innerHTML = html;
    } catch (err) {
      wrap.innerHTML = '<div class="empty">Could not load log.</div>';
    }
  }
  document.getElementById('refreshBtn').addEventListener('click', loadTodayLog);

  async function checkConnection(){
    const statusEl = document.getElementById('connStatus');
    if (WEB_APP_URL.includes('PASTE_YOUR')) {
      statusEl.innerHTML = '<span class="dot"></span><span>Not connected — paste your Web App URL in the code (see setup steps)</span>';
      statusEl.className = 'status bad';
      return;
    }
    try {
      const res = await fetch(`${WEB_APP_URL}?date=${todayStr()}`);
      if (res.ok) {
        statusEl.innerHTML = '<span class="dot"></span><span>Connected to Google Sheet</span>';
        statusEl.className = 'status ok';
      } else { throw new Error('bad response'); }
    } catch (err) {
      statusEl.innerHTML = '<span class="dot"></span><span>Could not reach Web App — check deployment/URL</span>';
      statusEl.className = 'status bad';
    }
  }
  checkConnection();
  loadTodayLog();

  // ================= ANALYSIS =================
  let allRows = [];
  let sessions = [];
  let chartInstance = null;
  let analysisLoaded = false;

  async function loadAnalysis(){
    if (WEB_APP_URL.includes('PASTE_YOUR')) {
      document.getElementById('historyTableWrap').innerHTML = '<div class="empty">Connect your Web App URL first.</div>';
      document.getElementById('weekCompare').innerHTML = '';
      document.getElementById('weeklyPatternWrap').innerHTML = '';
      return;
    }
    try {
      const res = await fetch(WEB_APP_URL);
      allRows = await res.json();
      buildSessions();
      populateAnalysisFilters();
      renderAnalysis();
      analysisLoaded = true;
    } catch (err) {
      document.getElementById('historyTableWrap').innerHTML = '<div class="empty">Could not load history.</div>';
    }
  }

  function buildSessions(){
    const map = {};
    allRows.forEach(r => {
      const key = `${r.Date}||${r.Exercise}`;
      if (!map[key]) {
        map[key] = { date: r.Date, day: r.Day, exercise: r.Exercise, bodyPart: r.BodyPart, duration: Number(r.Duration)||0, sets: [] };
      }
      map[key].sets.push({ setNumber: r.SetNumber, reps: Number(r.Reps)||0, weight: Number(r.Weight)||0 });
    });
    sessions = Object.values(map).map(s => {
      const volume = s.sets.reduce((sum,x)=> sum + x.reps*x.weight, 0);
      const maxWeight = s.sets.reduce((m,x)=> Math.max(m,x.weight), 0);
      const totalReps = s.sets.reduce((sum,x)=> sum + x.reps, 0);
      return Object.assign({}, s, { volume, maxWeight, totalReps });
    });
    sessions.sort((a,b) => new Date(a.date) - new Date(b.date));
  }

  function populateAnalysisFilters(){
    const bpSel = document.getElementById('analysisBodyPart');
    const currentBp = bpSel.value;
    const bps = [...new Set(sessions.map(s=>s.bodyPart).filter(Boolean))].sort();
    bpSel.innerHTML = '<option value="">All Body Parts</option>' + bps.map(bp=>`<option value="${bp}">${bp}</option>`).join('');
    bpSel.value = currentBp;
    updateExerciseFilter();
  }

  function updateExerciseFilter(){
    const bp = document.getElementById('analysisBodyPart').value;
    const exSel = document.getElementById('analysisExercise');
    const current = exSel.value;
    const exs = [...new Set(sessions.filter(s=> !bp || s.bodyPart===bp).map(s=>s.exercise).filter(Boolean))].sort();
    exSel.innerHTML = '<option value="">All Exercises</option>' + exs.map(e=>`<option value="${e}">${e}</option>`).join('');
    exSel.value = current;
  }

  document.getElementById('analysisBodyPart').addEventListener('change', () => { updateExerciseFilter(); renderAnalysis(); });
  document.getElementById('analysisExercise').addEventListener('change', renderAnalysis);

  function getFilteredSessions(){
    const bp = document.getElementById('analysisBodyPart').value;
    const ex = document.getElementById('analysisExercise').value;
    return sessions.filter(s => (!bp || s.bodyPart===bp) && (!ex || s.exercise===ex));
  }

  function getWeekRange(offsetWeeks){
    const now = new Date();
    const day = now.getDay();
    const diffToMonday = (day===0 ? -6 : 1-day);
    const monday = new Date(now); monday.setDate(now.getDate()+diffToMonday+offsetWeeks*7); monday.setHours(0,0,0,0);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
    return [monday, sunday];
  }

  function renderAnalysis(){
    const filtered = getFilteredSessions();

    // --- Week comparison ---
    const [thisMon,thisSun] = getWeekRange(0);
    const [lastMon,lastSun] = getWeekRange(-1);
    const inRange = (d,a,b) => { const dt = new Date(d); return dt>=a && dt<=b; };
    const thisWeek = filtered.filter(s=> inRange(s.date, thisMon, thisSun));
    const lastWeek = filtered.filter(s=> inRange(s.date, lastMon, lastSun));
    const thisVol = thisWeek.reduce((s,x)=>s+x.volume,0);
    const lastVol = lastWeek.reduce((s,x)=>s+x.volume,0);
    const up = thisVol >= lastVol;
    const pct = lastVol>0 ? Math.round(Math.abs((thisVol-lastVol)/lastVol)*100) : (thisVol>0 ? 100 : 0);
    document.getElementById('weekCompare').innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-label">This Week</div><div class="stat-value">${Math.round(thisVol).toLocaleString()}</div><div class="stat-sub">${thisWeek.length} session(s)</div></div>
        <div class="stat-box"><div class="stat-label">Last Week</div><div class="stat-value">${Math.round(lastVol).toLocaleString()}</div><div class="stat-sub">${lastWeek.length} session(s)</div></div>
        <div class="stat-box"><div class="stat-label">Change</div><div class="stat-value ${up?'up':'down'}">${up?'▲':'▼'} ${pct}%</div><div class="stat-sub">volume (kg×reps)</div></div>
      </div>`;

    // --- Progression chart ---
    const byDate = {};
    filtered.forEach(s=>{ byDate[s.date] = (byDate[s.date]||0) + s.volume; });
    const dates = Object.keys(byDate).sort((a,b)=> new Date(a)-new Date(b));
    const volumeData = dates.map(d=>Math.round(byDate[d]));

    let maxWeightData = null;
    const ex = document.getElementById('analysisExercise').value;
    if (ex) {
      const byDateWeight = {};
      filtered.forEach(s=>{ byDateWeight[s.date] = Math.max(byDateWeight[s.date]||0, s.maxWeight); });
      maxWeightData = dates.map(d=> byDateWeight[d] || null);
    }

    const canvas = document.getElementById('progressChart');
    if (chartInstance) chartInstance.destroy();
    if (!dates.length) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
    } else if (typeof Chart !== 'undefined') {
      const datasets = [{
        label: 'Volume (kg × reps)', data: volumeData,
        borderColor: '#2E5A88', backgroundColor: 'rgba(46,90,136,0.08)',
        tension: 0.3, fill: true, yAxisID: 'y'
      }];
      if (maxWeightData) {
        datasets.push({
          label: 'Max Weight (kg)', data: maxWeightData,
          borderColor: '#2F7A52', backgroundColor: 'transparent',
          tension: 0.3, yAxisID: 'y1'
        });
      }
      const scales = { y: { position:'left', title:{display:true,text:'Volume'} } };
      if (maxWeightData) scales.y1 = { position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Max Weight (kg)'} };
      chartInstance = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: { labels: dates, datasets },
        options: { responsive: true, interaction: { mode:'index', intersect:false }, scales }
      });
    }

    // --- History table with per-exercise deltas ---
    const lastVolByExercise = {};
    const withDelta = filtered.map(s=>{
      const prev = lastVolByExercise[s.exercise];
      const delta = prev===undefined ? null : s.volume - prev;
      lastVolByExercise[s.exercise] = s.volume;
      return Object.assign({}, s, { delta });
    });
    const rowsDesc = [...withDelta].reverse();
    const wrap = document.getElementById('historyTableWrap');
    if (!rowsDesc.length) {
      wrap.innerHTML = '<div class="empty">No sessions match this filter yet.</div>';
    } else {
      let html = '<table><tr><th>Date</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>Max Wt</th><th>Volume</th><th>vs Prev</th></tr>';
      rowsDesc.forEach(s=>{
        let deltaHtml = '<span style="color:var(--muted-2)">—</span>';
        if (s.delta !== null) {
          const isUp = s.delta >= 0;
          deltaHtml = `<span style="color:${isUp?'var(--success)':'var(--danger)'}">${isUp?'▲':'▼'} ${Math.abs(Math.round(s.delta))}</span>`;
        }
        html += `<tr><td>${s.date}</td><td>${s.exercise}</td><td>${s.sets.length}</td><td>${s.totalReps}</td><td>${s.maxWeight}</td><td>${Math.round(s.volume).toLocaleString()}</td><td>${deltaHtml}</td></tr>`;
      });
      html += '</table>';
      wrap.innerHTML = html;
    }

    // --- Weekly pattern (all-time, ignores filters) ---
    const patternMap = {};
    sessions.forEach(s=>{
      if (!s.day || !s.bodyPart) return;
      patternMap[s.day] = patternMap[s.day] || {};
      patternMap[s.day][s.bodyPart] = (patternMap[s.day][s.bodyPart]||0) + 1;
    });
    const weekOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    let patHtml = '<table><tr><th>Day</th><th>Most Common Body Part</th></tr>';
    weekOrder.forEach(day=>{
      const counts = patternMap[day];
      if (!counts) { patHtml += `<tr><td>${day}</td><td style="color:var(--muted-2)">No data yet</td></tr>`; return; }
      const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
      patHtml += `<tr><td>${day}</td><td>${top[0]} <span style="color:var(--muted-2)">(${top[1]}x)</span></td></tr>`;
    });
    patHtml += '</table>';
    document.getElementById('weeklyPatternWrap').innerHTML = patHtml;
  }
</script>
</body>
</html>
